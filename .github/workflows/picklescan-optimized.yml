# Optimized security gate: same PickleScan check, clearer logs and current Actions runtimes.
name: PickleScan Security Gate (Optimized)

on:
  pull_request:
    branches: [ main ]

jobs:
  scan-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install PickleScan
        run: |
          python -m pip install --upgrade pip
          pip install picklescan==1.0.4

      - name: Verify models directory exists
        run: |
          if [ ! -d models ]; then
            echo "models/ is missing; nothing to scan."
            exit 1
          fi
          echo "Models present:"
          ls -la models/

      - name: Run PickleScan on Models Directory
        run: |
          set -o pipefail
          echo "Scanning models directory for malicious globals..."
          picklescan --path models/ | tee scan-output.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## PickleScan (Optimized)"
            echo ""
            echo "Same security gate as the Simple workflow, with Node 24 actions and a scan summary."
            echo ""
            echo '```'
            cat scan-output.txt 2>/dev/null || echo "No scan output (scan may have failed before writing)."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
